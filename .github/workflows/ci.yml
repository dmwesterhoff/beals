name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Cache patched PARI
        uses: actions/cache@v4
        with:
          path: .tools
          key: pari-2.19.0-${{ runner.os }}-${{ hashFiles('certify/pari-2.19.0-bnftestprimes-range.patch', 'certify/build_pari.sh') }}
      - name: Build patched PARI/GP
        run: certify/build_pari.sh
      - name: Python deps
        run: python -m pip install pytest ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Setup (bnf + factor base generators)
        run: .tools/pari/bin/gp -q -D parisizemax=2000000000 certify/setup.gp < /dev/null && tail -1 results/setup.out | grep -q "STATUS OK"
      - name: Units 2-saturation
        run: .tools/pari/bin/gp -q -D parisizemax=1000000000 certify/units.gp < /dev/null && tail -1 results/units.out | grep -q "STATUS OK"
      - name: Reproducibility (regenerated outputs match committed ones)
        run: git diff --exit-code results/setup.out results/units.out
      - name: Tests
        run: pytest -q
      - name: Verify committed Phase 1 / generator chunk coverage
        run: python certify/check_results.py
